# geo-processor dan Job migrasinya hanya bicara dengan PostgreSQL
# (CloudNativePG), NATS, dan OTel Collector; tidak ada akses internet. DNS
# lewat policy allow-dns; selain itu namespace default deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geo-processor
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [geo-processor, geo-processor-migrate]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8082
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: siaga-db
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/component: nats
      ports:
        - { port: 4222, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { port: 4318, protocol: TCP }
