# geo-processor dan Job migrasinya hanya bicara dengan DNS cluster dan layanan
# di namespace siaga (PostgreSQL, NATS, OTel Collector); tidak ada akses internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geo-processor
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [geo-processor, geo-processor-migrate]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8082
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector: {}
