# Satu replika dan strategi Recreate: dua ingest berjalan bersamaan akan
# menggandakan pemakaian kuota sumber (anggaran request dihitung per proses).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: siaga-ingest
          ports:
            - name: http-status
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: siaga-ingest-env
            # OPENAQ_API_KEY dan FIRMS_MAP_KEY. Opsional: tanpa key, konektor
            # OpenAQ/FIRMS tidak dijalankan.
            - secretRef:
                name: siaga-ingest
                optional: true
          env:
            # Access key bucket arsip, dibuat Garage dari Secret yang sama.
            - name: ARCHIVE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: siaga-garage, key: GARAGE_DEFAULT_ACCESS_KEY }
            - name: ARCHIVE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: siaga-garage, key: GARAGE_DEFAULT_SECRET_KEY }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)
            # Runtime Go mengikuti batas memori container.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef: { resource: limits.memory }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /healthz, port: http-status }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http-status }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http-status }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
