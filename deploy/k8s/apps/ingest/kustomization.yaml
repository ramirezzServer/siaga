# ingest: polling sumber data bahaya → raw.* di NATS JetStream (ADR 0006, 0016).
# Konfigurasi non-rahasia di ConfigMap siaga-ingest-env (overlay menimpanya
# dengan behavior: merge); key sumber di Secret siaga-ingest, access key arsip
# di Secret siaga-garage (satu sumber untuk Garage dan ingest).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: siaga
labels:
  - pairs:
      app.kubernetes.io/name: ingest
      app.kubernetes.io/part-of: siaga
      app.kubernetes.io/component: pipa-data
    # Selector ditulis eksplisit di tiap manifest: includeSelectors juga akan
    # mengisi podSelector kosong di NetworkPolicy dan mengubah artinya.
    includeSelectors: false
    includeTemplates: true
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: siaga-ingest-env
    literals:
      - NATS_URL=nats://nats:4222
      - INGEST_HTTP_ADDR=0.0.0.0:8081
      - LOG_LEVEL=info
      # Garage di cluster (deploy/k8s/platform/garage), awalan sama dengan Compose.
      - INGEST_ARCHIVE_URL=s3://siaga-arsip/raw?endpoint=http://garage:3900
      # OTel Collector di cluster; token Grafana Cloud hanya dipegang Collector.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
