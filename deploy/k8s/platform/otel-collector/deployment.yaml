# OTel Collector satu replika (distribusi otelcol-k8s: receiver OTLP dan
# Prometheus, exporter OTLP/HTTP, tanpa komponen yang tidak dipakai SIAGA).
# Tidak butuh API Kubernetes: atribut pod dikirim layanan sendiri lewat
# OTEL_RESOURCE_ATTRIBUTES.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-k8s:0.161.0
          args: [--config=/conf/config.yaml]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          envFrom:
            - configMapRef:
                name: siaga-otel-collector-env
            # OTLP_UPSTREAM_ENDPOINT dan OTLP_UPSTREAM_AUTHORIZATION.
            - secretRef:
                name: siaga-otel-collector
          env:
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: siaga-garage, key: GARAGE_METRICS_TOKEN }
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef: { resource: limits.memory }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: siaga-otel-collector-config
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
