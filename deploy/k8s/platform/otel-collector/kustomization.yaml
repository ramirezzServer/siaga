# OTel Collector: gerbang telemetri ke Grafana Cloud (ADR 0015, 0017).
# Konfigurasi di config.yaml (ConfigMap hasil generator; hash di nama memicu
# rollout saat berubah). Kredensial tujuan di Secret siaga-otel-collector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: siaga
labels:
  - pairs:
      app.kubernetes.io/part-of: siaga
      app.kubernetes.io/component: platform
    includeSelectors: false
    includeTemplates: true
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: siaga-otel-collector-config
    files:
      - config.yaml
  - name: siaga-otel-collector-env
    literals:
      - SIAGA_ENV=lokal
