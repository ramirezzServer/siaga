# API S3 untuk ingest (dan core-api nanti) serta admin API (/health, /metrics)
# untuk OTel Collector. Tidak diekspos ke luar cluster.
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
