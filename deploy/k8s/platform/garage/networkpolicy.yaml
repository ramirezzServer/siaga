# Garage menerima S3 hanya dari ingest dan CronJob archive-maintenance
# (cadangan dan retensi, ADR 0022), dan admin API (/metrics) hanya dari OTel
# Collector. Tanpa egress: satu node tidak bicara dengan node lain, dan
# cadangan ke object storage di luar cluster dikirim archive-maintenance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: archive-maintenance
      ports:
        - { port: 3900, protocol: TCP }
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { port: 3903, protocol: TCP }
  egress: []
