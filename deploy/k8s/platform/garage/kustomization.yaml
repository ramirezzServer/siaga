# Garage: object storage S3 untuk arsip payload mentah (ADR 0014, 0017).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: siaga
labels:
  - pairs:
      app.kubernetes.io/part-of: siaga
      app.kubernetes.io/component: platform
    # Selector ditulis eksplisit di tiap manifest (lihat apps/ingest).
    includeSelectors: false
    includeTemplates: true
resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: siaga-garage-config
    files:
      - garage.toml
  - name: siaga-garage-env
    literals:
      - GARAGE_DEFAULT_BUCKET=siaga-arsip
      - RUST_LOG=garage=info
