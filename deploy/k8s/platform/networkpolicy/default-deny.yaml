# Semua pod di namespace siaga ditolak masuk dan keluar kecuali diizinkan
# policy lain (NetworkPolicy bersifat aditif). Port-forward dari laptop (Tilt,
# kubectl) tidak terpengaruh karena masuk lewat kubelet ke localhost pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
