# Manifest lokal untuk Tilt. Build dengan: kustomize build --load-restrictor LoadRestrictionsNone
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: siaga
resources:
  - ../base/namespace.yaml
  - ../base/postgres-image-catalog.yaml
  - ../base/postgres-cluster.yaml
  - ../base/valkey.yaml
  - ../base/mailpit.yaml
  - ../platform/networkpolicy
  - ../platform/garage
  - ../platform/otel-collector
  - otel-collector-lokal.yaml
  - ../apps/ingest
  - ../apps/geo-processor
configMapGenerator:
  - name: siaga-db-bootstrap
    files:
      - ../../../infra/db/bootstrap/001_extensions.sql
      - ../../../infra/db/bootstrap/002_roles.sql
      - ../../../infra/db/bootstrap/003_schemas.sql
  - name: siaga-ingest-env
    behavior: merge
    literals:
      - SIAGA_ENV=lokal
      # Laptop biasanya juga menjalankan `make ingest` sebagai pengumpul arsip
      # utama. Sapuan prakiraan penuh (±6.000 request BMKG, ±2 jam) dari dua
      # proses di IP yang sama menggandakan laju ke BMKG; di cluster lokal
      # cukup 100 kode wilayah pertama (wilayah fokus) per sapuan.
      - INGEST_FORECAST_LIMIT=100
  - name: siaga-geo-env
    behavior: merge
    literals:
      - SIAGA_ENV=lokal
generatorOptions:
  disableNameSuffixHash: true
