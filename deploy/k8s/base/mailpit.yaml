# Hanya untuk lokal: menangkap semua email tanpa benar-benar mengirim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: siaga
  labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: siaga }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: siaga }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: siaga
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
