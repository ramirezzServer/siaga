apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: siaga
  labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: siaga }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: siaga }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: siaga
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
