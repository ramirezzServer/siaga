# Profil "lite" (~2 GB RAM): data store inti dan object storage untuk
# pengembangan harian. Profil tambahan "obs" (make obs-up) menambah Grafana
# dan penyimpan telemetri lokal.
# Jalankan dari root repo: make up
name: siaga

services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/images/postgres/Dockerfile
    image: siaga-postgres:local
    env_file: ../../.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  # Object storage S3 untuk arsip payload mentah (ADR 0014). --single-node
  # menyusun layout sendiri; --default-bucket membuat bucket dan access key
  # dari environment bila belum ada (idempotent).
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?jalankan make env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?jalankan make env}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?jalankan make env}
      GARAGE_DEFAULT_ACCESS_KEY: ${ARCHIVE_S3_ACCESS_KEY_ID:?jalankan make env}
      GARAGE_DEFAULT_SECRET_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:?jalankan make env}
      GARAGE_DEFAULT_BUCKET: ${ARCHIVE_BUCKET:-siaga-arsip}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:3903:3903"
    healthcheck:
      # Image Garage tanpa shell/curl; CLI-nya bertanya ke node lewat RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Observability lokal (ADR 0015): Grafana, Prometheus, Tempo, Loki, dan
  # OTel Collector dalam satu container (~1 GB RAM), hanya dengan
  # `make obs-up` (profil obs). ingest dan geo-processor mengirim OTLP/HTTP ke
  # 127.0.0.1:4318 bila OTEL_EXPORTER_OTLP_ENDPOINT diisi di .env. Grafana di
  # http://127.0.0.1:3300 (login anonim sebagai admin; hanya dari laptop).
  # OTLP_BIND=0.0.0.0 di .env membuka port OTLP untuk OTel Collector di cluster
  # k3d (host.k3d.internal); Grafana tetap hanya di 127.0.0.1.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/siaga/siaga-pipa-data.json
    ports:
      - "127.0.0.1:3300:3000"
      - "${OTLP_BIND:-127.0.0.1}:4318:4318"
    volumes:
      - lgtmdata:/data
      - ../observability/grafana/provisioning/siaga-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/siaga.yaml:ro
      - ../observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/siaga:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
  natsdata:
  garagemeta:
  garagedata:
  lgtmdata:
