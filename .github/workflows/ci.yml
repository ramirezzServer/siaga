name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_MODULES: libs/go/platform libs/go/contracts services/geo-processor services/ingest
  # Layanan yang wajib coverage domain + app >= 85%.
  GO_SERVICES: services/geo-processor services/ingest

jobs:
  secrets:
    name: Pindai secret
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI langsung, bukan gitleaks-action: action itu gagal pada push pertama
      # (rentang commit diawali commit akar) dan masih berjalan di Node 20.
      - name: Pasang gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p bin && tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Pindai seluruh riwayat
        run: gitleaks git --redact --no-banner -v .

  go:
    name: Go (lint + unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: go.mod dan go.sum rapi
        run: |
          for m in $GO_MODULES; do (cd "$m" && go mod tidy -diff); done
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: services/geo-processor
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: services/ingest
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: libs/go/platform
      - name: Unit test
        run: |
          for m in $GO_MODULES; do (cd "$m" && go test -race -count=1 -coverprofile=coverage.out ./...); done
      - name: Coverage domain >= 85%
        run: |
          for s in $GO_SERVICES; do
            (
              cd "$s"
              go test -count=1 -coverprofile=domain.out ./internal/domain/... ./internal/app/... >/dev/null
              total=$(go tool cover -func=domain.out | awk '/^total:/ {sub("%","",$3); print $3}')
              echo "$s coverage domain+app: ${total}%"
              awk -v t="$total" 'BEGIN { exit (t >= 85) ? 0 : 1 }'
            )
          done
      - name: Fuzz singkat
        run: |
          fz() { go test "$1" -run='^$' -fuzz="^$2\$" -fuzztime=20s; }
          cd services/geo-processor
          fz ./internal/domain/region FuzzParseCode
          fz ./internal/domain/region FuzzParseLatLngPath
          fz ./internal/adapters/cahyadsn FuzzParseDump
          fz ./internal/domain/quake FuzzClusteringOrderIndependent
          fz ./internal/domain/quake FuzzClusteringInvariantsUnderCrowding
          fz ./internal/domain/quake FuzzApplyOrderIndependent
          fz ./internal/domain/quake FuzzLevelMonotone
          fz ./internal/domain/quake FuzzRuleMatchSymmetric
          fz ./internal/app/quakes FuzzServiceOrderIndependent
          fz ./internal/domain/weather FuzzDeriveOrderIndependent
          fz ./internal/app/warnings FuzzServiceOrderIndependent
          fz ./internal/domain/series FuzzWeatherValidate
          cd ../ingest
          fz ./internal/domain/ratelimit FuzzWindowBound
          fz ./internal/domain/ratelimit FuzzPriorityHeadroom
          fz ./internal/domain/ratelimit FuzzAvailable
          fz ./internal/domain/schedule FuzzNextBounds
          fz ./internal/domain/forecast FuzzOrder
          fz ./internal/domain/warning FuzzParseReferences
          fz ./internal/adapters/bmkg FuzzParse
          fz ./internal/adapters/bmkg FuzzParseCAPDocuments
          fz ./internal/adapters/bmkg FuzzParseForecastDocument
          fz ./internal/adapters/usgs FuzzParse
          fz ./internal/adapters/openmeteo FuzzParse
          fz ./internal/domain/airquality FuzzClean
          fz ./internal/adapters/firms FuzzParseFIRMS
          fz ./internal/adapters/openaq FuzzParseOpenAQ
          fz ./internal/domain/archivekey FuzzParse
          fz ./internal/app/replay FuzzRunOrdered
          cd ../../libs/go/platform
          fz ./otelx FuzzValidTraceParent

  node:
    name: TypeScript + kontrak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:proto
      - name: Perubahan proto tidak merusak kompatibilitas
        if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - run: pnpm run lint:openapi
      - run: pnpm run format:check
      - name: Kode hasil generate sesuai kontrak
        run: |
          pnpm run gen
          git diff --exit-code -- libs/go/contracts/gen packages/contracts-ts/src/gen packages/api-client/src/gen
      - run: pnpm exec turbo run lint typecheck test build

  dart-client:
    name: Klien Dart dari OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate klien dart-dio
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/local" openapitools/openapi-generator-cli:v7.16.0 generate \
            -i /local/contracts/openapi/core-api.yaml -g dart-dio -o /local/.cache/api-client-dart \
            --additional-properties=pubName=siaga_api_client
      - uses: dart-lang/setup-dart@v1
      # Kode ini buatan generator: yang dijaga adalah kontrak OpenAPI menghasilkan klien
      # yang terkompilasi. Error tetap menggagalkan job; catatan gaya seperti unused
      # import dari template generator tidak.
      - name: Analisis klien
        working-directory: .cache/api-client-dart
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze --no-fatal-warnings lib

  database:
    name: PostgreSQL (migrasi + integrasi + import nyata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Build image PostgreSQL
        run: docker build -f deploy/images/postgres/Dockerfile -t siaga-postgres:ci .
      - name: Jalankan PostgreSQL
        run: |
          cp .env.example .env
          sed -i 's/=ganti-saya/=ci-password/' .env
          docker run -d --name pg --env-file .env -p 5432:5432 siaga-postgres:ci
          for i in $(seq 60); do docker exec pg pg_isready -U postgres -d siaga && break; sleep 2; done
          docker exec pg psql -U postgres -d siaga -tAc "select string_agg(extname, ',' order by extname) from pg_extension"
      - name: Migrasi naik, turun, naik
        working-directory: services/geo-processor
        env:
          DB: postgres://siaga_geo:ci-password@localhost:5432/siaga?sslmode=disable
        run: |
          for step in up down up; do GOWORK=off go tool goose -dir migrations -table ref.goose_db_version postgres "$DB" $step; done
      - name: Test integrasi
        working-directory: services/geo-processor
        env:
          SIAGA_TEST_DATABASE_URL: postgres://siaga_geo:ci-password@localhost:5432/siaga?sslmode=disable
        # -p 1: paket berbagi database uji, jadi tidak boleh jalan bersamaan.
        run: go test -race -count=1 -p 1 -tags integration ./...
      - name: Import Jawa Barat dari data asli
        env:
          DATABASE_URL: postgres://siaga_geo:ci-password@localhost:5432/siaga?sslmode=disable
        run: |
          scripts/fetch-region-data.sh 32
          cd services/geo-processor
          go run ./cmd/import-regions -source ../../.cache/wilayah_boundaries/db -province 32
          count=$(docker exec pg psql -U postgres -d siaga -tAc "select count(*) from ref.region where code like '32%'")
          echo "wilayah Jawa Barat: $count"
          test "$count" -ge 6600
      - name: Pindai kerentanan image
        # Dipin ke commit, bukan tag: tag action pihak ketiga bisa dipindah.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Pengecualian terdokumentasi dan kedaluwarsa; lihat .trivyignore.yaml.
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: siaga-postgres:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  archive:
    name: Garage (arsip S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Jalankan Garage single-node
        run: |
          key="GK$(openssl rand -hex 12)"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          {
            echo "ARCHIVE_S3_ACCESS_KEY_ID=$key"
            echo "ARCHIVE_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$GITHUB_ENV"
          docker run -d --name garage -p 3900:3900 \
            -v "$PWD/deploy/compose/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_ADMIN_TOKEN="$(openssl rand -hex 24)" \
            -e GARAGE_METRICS_TOKEN="$(openssl rand -hex 24)" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$key" -e GARAGE_DEFAULT_SECRET_KEY="$secret" \
            -e GARAGE_DEFAULT_BUCKET=siaga-arsip \
            "$(awk '/image: dxflrs\/garage/ {print $2}' deploy/compose/compose.lite.yaml)" \
            /garage server --single-node --default-bucket
          for i in $(seq 30); do docker exec garage /garage status && break; sleep 2; done
          docker exec garage /garage bucket info siaga-arsip
      - name: Test integrasi arsip
        working-directory: services/ingest
        env:
          SIAGA_TEST_S3_ENDPOINT: http://127.0.0.1:3900
          ARCHIVE_BUCKET: siaga-arsip
        run: go test -race -count=1 -tags integration ./internal/adapters/s3archive/
      - name: Log Garage bila gagal
        if: failure()
        run: docker logs garage

  images:
    name: Image layanan Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push ke GHCR dan tanda tangan cosign keyless (OIDC), hanya di push ke main.
      packages: write
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/ramirezzserver
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingest
            binaries: ingest archive replay
          - service: geo-processor
            binaries: geo-processor import-regions
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Versi
        run: echo "VERSION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      # Build amd64 dulu dan muat ke Docker lokal untuk uji asap dan Trivy;
      # build multi-arch di bawah memakai ulang cache yang sama.
      - name: Build (amd64, lokal)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/go/Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            SERVICE=${{ matrix.service }}
            BINARIES=${{ matrix.binaries }}
            VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          load: true
          tags: siaga-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Uji asap
        run: |
          case "${{ matrix.service }}" in
            ingest) scripts/image-smoke.sh --ingest siaga-ingest:ci ;;
            geo-processor) scripts/image-smoke.sh --geo siaga-geo-processor:ci ;;
          esac
      - name: Pindai kerentanan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: siaga-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Tag image
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/siaga-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main
      - name: Login GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cross-compile di Dockerfile, jadi arm64 (VM Oracle) tidak butuh QEMU.
      - name: Build dan push (amd64 + arm64)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/go/Dockerfile
          target: ${{ matrix.service }}
          build-args: |
            SERVICE=${{ matrix.service }}
            BINARIES=${{ matrix.binaries }}
            VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Tanda tangan image (cosign keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/siaga-${{ matrix.service }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "### siaga-${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  manifests:
    name: Manifest Kubernetes
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: 5.7.1
      KUBECONFORM_VERSION: 0.7.0
    steps:
      - uses: actions/checkout@v5
      - name: Pasang kustomize dan kubeconform
        run: |
          cd "$RUNNER_TEMP"
          k="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          curl -sSfLO "$k/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$k/checksums.txt"
          grep " kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          c="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}"
          curl -sSfLO "$c/kubeconform-linux-amd64.tar.gz"
          curl -sSfL -o kc-checksums.txt "$c/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" kc-checksums.txt | sha256sum -c -
          mkdir -p bin
          tar -xzf "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -C bin kustomize
          tar -xzf kubeconform-linux-amd64.tar.gz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Tanpa kunci age: hanya memastikan tidak ada nilai plaintext yang ikut ter-commit.
      - name: Secret SOPS terenkripsi
        run: scripts/sops-check.sh
      - name: Validasi config OTel Collector
        run: |
          image=$(grep -oE 'otel/opentelemetry-collector-k8s:[0-9.]+' deploy/k8s/platform/otel-collector/deployment.yaml)
          docker run --rm -v "$PWD/deploy/k8s/platform/otel-collector:/conf:ro" \
            -e OTLP_UPSTREAM_ENDPOINT=https://contoh.invalid/otlp -e GARAGE_METRICS_TOKEN=uji -e SIAGA_ENV=ci \
            "$image" validate --config=/conf/config.yaml
      - name: Render dan validasi overlay
        run: |
          mkdir -p rendered
          for o in local prod; do
            kustomize build --load-restrictor LoadRestrictionsNone "deploy/k8s/$o" > "rendered/$o.yaml"
            # CRD CloudNativePG (Cluster) dan sops-secrets-operator (SopsSecret)
            # tidak ada di skema bawaan.
            kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 "rendered/$o.yaml"
          done
      # Hanya overlay prod: overlay lokal membawa Mailpit (alat dev, image
      # pihak ketiga yang jalan sebagai root) yang memang tidak ke produksi.
      - name: Pindai konfigurasi produksi (Trivy misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: config
          scan-ref: rendered/prod.yaml
          severity: CRITICAL,HIGH
          exit-code: "1"

  commits:
    name: Format pesan commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
