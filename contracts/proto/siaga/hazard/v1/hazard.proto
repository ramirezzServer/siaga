syntax = "proto3";

package siaga.hazard.v1;

import "google/protobuf/timestamp.proto";
import "siaga/common/v1/geo.proto";

// Jenis bahaya yang dipantau SIAGA.
enum HazardKind {
  HAZARD_KIND_UNSPECIFIED = 0;
  HAZARD_KIND_EARTHQUAKE = 1;
  HAZARD_KIND_WEATHER = 2;
  HAZARD_KIND_FLOOD = 3;
  HAZARD_KIND_WILDFIRE = 4;
  HAZARD_KIND_AIR_QUALITY = 5;
}

// Tingkat peringatan, urut dari paling ringan. Aturan penentuannya ada di PRD,
// bagian Aturan bisnis.
enum AlertLevel {
  ALERT_LEVEL_UNSPECIFIED = 0;
  ALERT_LEVEL_INFO = 1;
  ALERT_LEVEL_WASPADA = 2;
  ALERT_LEVEL_SIAGA = 3;
  ALERT_LEVEL_BAHAYA = 4;
}

// Asal data mentah.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_BMKG = 1;
  SOURCE_USGS = 2;
  SOURCE_OPEN_METEO = 3;
  SOURCE_NASA_FIRMS = 4;
  SOURCE_OPENAQ = 5;
  // Kejadian simulasi dari mode latihan. Tidak pernah dikirim ke pengguna di luar mode latihan.
  SOURCE_DRILL = 6;
}

// Kejadian bahaya yang sudah dinormalisasi dan dideduplikasi oleh geo-processor.
message Hazard {
  // ID deterministik: hash dari sumber utama dan ID asli sumber, sehingga
  // memproses ulang data yang sama menghasilkan ID yang sama.
  string id = 1;
  HazardKind kind = 2;
  AlertLevel level = 3;
  // Sumber utama (misal BMKG untuk gempa yang juga dilaporkan USGS).
  Source primary_source = 4;
  // ID kejadian di sumber utama.
  string source_event_id = 5;
  // Waktu kejadian menurut sumber.
  google.protobuf.Timestamp occurred_at = 6;
  // Waktu SIAGA pertama kali mendeteksi data ini.
  google.protobuf.Timestamp detected_at = 7;
  // Kapan kejadian dianggap tidak aktif lagi.
  google.protobuf.Timestamp expires_at = 8;
  // Titik representatif (episenter, pusat poligon peringatan, titik api).
  siaga.common.v1.Point location = 9;
  // Area terdampak sebagai GeoJSON geometry, bila ada.
  string area_geojson = 10;
  // Kelurahan/desa dalam area terdampak, terdekat lebih dulu. Bersifat estimasi.
  // Dibatasi 100 wilayah terdekat supaya pesan tetap kecil; jumlah lengkapnya
  // di impacted_region_count dan daftar lengkapnya di hazard.impact_region.
  repeated siaga.common.v1.RegionRef impacted_regions = 11;
  // Teks judul dan ringkasan dalam bahasa Indonesia.
  string title = 12;
  string summary = 13;
  // true untuk kejadian mode latihan.
  bool drill = 14;
  // Naik satu setiap kali isi kejadian berubah; konsumen mengabaikan revisi
  // yang lebih lama dari yang sudah dimiliki.
  uint32 revision = 15;
  // Jumlah seluruh wilayah terdampak, termasuk yang tidak muat di impacted_regions.
  uint32 impacted_region_count = 16;

  oneof detail {
    EarthquakeDetail earthquake = 20;
    WeatherWarningDetail weather = 21;
    FloodDetail flood = 22;
  }
}

// Detail gempa.
message EarthquakeDetail {
  double magnitude = 1;
  double depth_km = 2;
  // Deskripsi wilayah dirasakan dari BMKG, apa adanya (misal "III Bandung").
  string felt_description = 3;
  bool tsunami_potential = 4;
  string shakemap_url = 5;
  // Sumber lain yang melaporkan kejadian yang sama (misal USGS).
  repeated SourceReport corroborating_reports = 6;
  // Estimasi radius dirasakan di permukaan (km), dari PRD bagian Aturan bisnis.
  // Nol bila gempa terlalu dalam untuk dirasakan menurut rumus itu.
  double felt_radius_km = 7;
  // Jenis magnitudo menurut sumber utama (USGS: "mb", "mww", ...). Kosong untuk BMKG.
  string magnitude_type = 8;
}

// Laporan sumber sekunder untuk kejadian yang sama.
message SourceReport {
  Source source = 1;
  string source_event_id = 2;
  double magnitude = 3;
  siaga.common.v1.Point location = 4;
  google.protobuf.Timestamp occurred_at = 5;
  double depth_km = 6;
  // URL halaman kejadian di situs sumber.
  string source_url = 7;
}

// Detail peringatan dini cuaca (CAP BMKG). Isinya dari pesan CAP terbaru
// dalam rantai pembaruan kejadian; area-nya ada di Hazard.area_geojson.
message WeatherWarningDetail {
  // Nilai CAP apa adanya: Minor, Moderate, Severe, Extreme.
  string cap_severity = 1;
  string cap_event = 2;
  string headline = 3;
  // Teks asli BMKG, ditampilkan tanpa diubah.
  string description = 4;
  string instruction = 5;
  // ID pesan CAP terbaru (alert/identifier).
  string cap_identifier = 6;
  // Nilai CAP apa adanya: msgType (Alert, Update, Cancel), urgency, certainty.
  string cap_msg_type = 7;
  string cap_urgency = 8;
  string cap_certainty = 9;
  // Kode jenis kejadian, misal "OET-194".
  string cap_event_code = 10;
  // Teks versi bahasa Inggris dari sumber; kosong bila sumber tidak menyediakan.
  string cap_event_en = 11;
  string headline_en = 12;
  string description_en = 13;
  string instruction_en = 14;
  // Nama area menurut sumber, misal "Jawa Barat".
  string area_desc = 15;
  // URL infografis atau halaman peringatan di situs sumber.
  string web_url = 16;
  // URL dokumen CAP di situs sumber.
  string source_url = 17;
  // Luas area peringatan (km²) setelah poligon digabung dan diperbaiki.
  double area_km2 = 18;
  // Jumlah pesan CAP dalam rantai kejadian ini (pesan awal + pembaruan).
  uint32 message_count = 19;
}

// Indikator potensi banjir.
enum FloodIndicator {
  FLOOD_INDICATOR_UNSPECIFIED = 0;
  // Debit sungai model (GloFAS) di titik pantau sungai, dibandingkan dengan
  // persentil debit harian reanalisis di sel yang sama.
  FLOOD_INDICATOR_DISCHARGE = 1;
  // Indeks hujan sub-DAS: akumulasi hujan rata-rata wilayah 3, 6, dan 24 jam
  // dibandingkan dengan persentil historisnya. Bukan pengukuran debit:
  // tingkat tertinggi Siaga dan berlabel "indikasi potensi banjir".
  FLOOD_INDICATOR_RAINFALL_INDEX = 2;
}

// Detail potensi banjir di satu titik pantau sungai atau satu sub-DAS (ADR
// 0020–0021). Semua angka adalah keluaran model, bukan pengukuran lapangan.
message FloodDetail {
  FloodIndicator indicator = 1;
  // ID titik pantau: "river:<slug>" (debit) atau "catchment:<slug>" (indeks hujan).
  string site_id = 2;
  // Nama titik pantau atau sub-DAS, misal "Nanjung" atau "Cikapundung".
  string site_name = 3;
  // Sungai titik pantau debit; kosong untuk sub-DAS.
  string river = 4;
  // Model sumber, misal "glofas_v4" atau "ecmwf_ifs".
  string model = 5;
  // Waktu SIAGA menerima keluaran model yang dinilai.
  google.protobuf.Timestamp issued_at = 6;
  // Tanggal UTC (pukul 00.00) hari pertama dengan tingkat tertinggi di jendela.
  google.protobuf.Timestamp peak_date = 7;
  // true bila tingkat kejadian dinaikkan satu dari P75 ensemble ("kemungkinan").
  bool possible = 8;
  // Waktu terima keluaran terakhir yang mencapai ambang Info; kejadian
  // berakhir 24 jam setelahnya bila tidak ada keluaran baru di atas ambang.
  google.protobuf.Timestamp last_exceeded_at = 9;
  // Hari ini sampai 3 hari ke depan (tanggal UTC), urut tanggal.
  repeated FloodDay days = 10;
  // Ambang debit efektif Info, Waspada, Siaga, Bahaya (m³/s) setelah koreksi
  // bias. Kosong untuk indeks hujan.
  repeated double discharge_thresholds_m3s = 11;
  // Ambang indeks hujan per jendela akumulasi. Kosong untuk debit.
  repeated RainfallThreshold rainfall_thresholds = 12;
  // Tingkat tertinggi yang boleh dicapai titik ini (indeks hujan dan titik di
  // hilir waduk: Siaga).
  AlertLevel max_level = 13;
}

// Ambang indeks hujan satu jendela akumulasi.
message RainfallThreshold {
  uint32 window_hours = 1;
  // Ambang Info, Waspada, Siaga, Bahaya (mm).
  repeated double thresholds_mm = 2;
}

// Penilaian satu hari prakiraan.
message FloodDay {
  // Tanggal UTC pukul 00.00.
  google.protobuf.Timestamp date = 1;
  // ALERT_LEVEL_UNSPECIFIED berarti di bawah ambang Info atau tanpa data.
  AlertLevel level = 2;
  // true bila tingkat hari ini dinaikkan satu dari P75 ensemble.
  bool possible = 3;
  // Debit penentu tingkat: median ensemble, atau debit tunggal bila
  // statistik ensemble kosong.
  optional double discharge_m3s = 4;
  optional double discharge_p75_m3s = 5;
  // Maksimum ensemble: skenario terburuk, tidak menentukan tingkat.
  optional double discharge_max_m3s = 6;
  // Akumulasi hujan rata-rata wilayah terbesar yang berakhir di hari itu (mm).
  optional double rain_3h_mm = 7;
  optional double rain_6h_mm = 8;
  optional double rain_24h_mm = 9;
  // Jendela indeks hujan (jam) yang menentukan tingkat; 0 untuk debit atau
  // bila di bawah ambang Info.
  uint32 window_hours = 10;
  // true bila discharge_m3s adalah median ensemble, false bila debit tunggal.
  bool from_ensemble = 11;
}
